<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KamAI</title>
    <script>
      // GitHub Pages 404 redirect fix for client-side routing
      var path = window.location.pathname;
      var base = '/ITS120L_Group3_AI-Sign-Language-Interpreter';
      var trimmed = path.replace(base, '') || '/';
      window.location.replace(
        base + '/?path=' + encodeURIComponent(trimmed) + window.location.search.slice(1)
      );
    </script>
  </head>
  <body></body>
</html>
